# Inspection and lightweight Slurm test commands for Rocky Linux 9.8.
# Based on commands executed on 2026-11-23; the `srun` line launches a job.
# Sanitize network addresses, tokens, and secrets before sharing logs publicly.

cat /etc/rocky-release
hostname -s
sinfo -N -l
scontrol show config | grep -E 'SlurmctldHost|SelectType|TaskPlugin'
srun --partition=debug --nodes=4 --ntasks=4 --ntasks-per-node=1 --time=00:02:00 /usr/bin/hostname
sudo wwctl node list -a
sudo exportfs -v
sudo firewall-cmd --get-active-zones
systemctl is-active munge slurmctld warewulfd
rpm -qa | grep -Ei 'warewulf|slurm|munge|openmpi|openhpc'
ip -br addr

# NOT included as verification steps: `wwctl overlay build` and
# `wwctl configure --all` mutate configuration / deployment state.
