# LIVE FIREWALL OBSERVATION, 2026-11-23. Bash-compatible READ-ONLY commands.
# Public interface enp2s0 on campus network: DO NOT treat as Internet-exposed
# without an actual network perimeter assessment. But cluster services allowed
# in the public zone warrant prompt school-admin review.
# Runtime public: cockpit,dhcp,dhcpv6-client,nfs,ssh,tftp; 9873/tcp,6817-6818/tcp
# Runtime trusted: enp3s0, target ACCEPT, all inbound accepted.
# Default zone: public. Permanent public zone had no explicit interfaces,
# whereas runtime public had enp2s0. Check persistence after a maintenance reboot.
# Permanent trusted zone showed enp3s0; no changes proposed here.
sudo firewall-cmd --get-active-zones
sudo firewall-cmd --get-default-zone
sudo firewall-cmd --zone=public --list-all
sudo firewall-cmd --zone=trusted --list-all
sudo firewall-cmd --permanent --zone=public --list-all
sudo firewall-cmd --permanent --zone=trusted --list-all
# No firewall changes are made by this document.
