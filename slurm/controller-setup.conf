# HISTORICAL Slurm controller setup commands recorded in the build.
# NOT idempotent; DO NOT rerun on the live cluster. Existing UID/GID and
# slurmctld directories/services must be inspected before any redeployment.
# Fixed UID/GID (992) below was historical; do not assume other hosts match.

# ARCHIVED COMMAND (NOT FOR AUTOMATIC EXECUTION): sudo dnf install -y epel-release
# ARCHIVED COMMAND (NOT FOR AUTOMATIC EXECUTION): sudo dnf install -y slurm-slurmctld slurm-slurmd munge

# ARCHIVED COMMAND (NOT FOR AUTOMATIC EXECUTION): sudo groupadd -r -g 992 slurm 2>/dev/null || sudo groupadd -r slurm
# ARCHIVED COMMAND (NOT FOR AUTOMATIC EXECUTION): sudo useradd -r -g slurm -u 992 -d /var/lib/slurm -s /bin/false slurm 2>/dev/null || sudo useradd -r -g slurm -d /var/lib/slurm -s /bin/false slurm

# ARCHIVED COMMAND (NOT FOR AUTOMATIC EXECUTION): sudo mkdir -p /var/spool/slurmctld
# ARCHIVED COMMAND (NOT FOR AUTOMATIC EXECUTION): sudo chown -R slurm:slurm /var/spool/slurmctld
# ARCHIVED COMMAND (NOT FOR AUTOMATIC EXECUTION): sudo chmod 755 /var/spool/slurmctld

# ARCHIVED COMMAND (NOT FOR AUTOMATIC EXECUTION): sudo systemctl enable --now munge
# ARCHIVED COMMAND (NOT FOR AUTOMATIC EXECUTION): sudo systemctl enable --now slurmctld
