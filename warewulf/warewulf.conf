# Reference snapshot of /etc/warewulf/warewulf.conf, 2026-11-23.
# No passwords/keys were present in the observed text. DO NOT deploy blindly.
# WARNING: secure: false is the observed setting, NOT a recommendation.
WW_INTERNAL: 43
ipaddr: 192.168.10.2
netmask: 255.255.255.0
network: 192.168.10.0
device: enp3s0
warewulf:
    port: 9873
    tls port: 9874
    secure: false
    update interval: 60
    autobuild overlays: true
    host overlay: true
    grubboot: false
    systemd name: warewulfd
api:
    enabled: false
    allowed subnets:
        - 127.0.0.0/8
        - ::1/128
dhcp:
    enabled: true
    template: default
    range start: 192.168.10.100
    range end: 192.168.10.200
    systemd name: dhcpd
tftp:
    enabled: true
    tftproot: /srv/tftpboot
    systemd name: tftp
    ipxe:
        00:0B: arm64-efi /snponly.efi
        "00:00": undionly.kpxe
        "00:07": ipxe-snponly-x86_64.efi
        "00:09": ipxe-snponly-x86_64.efi
nfs:
    enabled: true
    export paths:
        - path: /home
          export options: rw,sync
        - path: /opt
          export options: ro,sync,no_root_squash
    systemd name: nfs-server
ssh:
    key types:
        - ed25519
        - ecdsa
        - rsa
        - dsa
image mounts:
    - source: /etc/resolv.conf
      dest: /etc/resolv.conf
      readonly: true
paths:
    bindir: /usr/bin
    sysconfdir: /etc
    localstatedir: /srv
    cachedir: /var/cache
    ipxesource: /usr/share/ipxe
    srvdir: /srv
    firewallddir: /usr/lib/firewalld/services
    systemddir: /usr/lib/systemd/system
    datadir: /usr/share
    wwoverlaydir: /srv/warewulf/overlays
    wwchrootdir: /srv/warewulf/chroots
    wwprovisiondir: /srv/warewulf/provision
    wwclientdir: /warewulf
    wwfilesdir: /srv/warewulf/files
